name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  # A capture run commits its refreshed data with GITHUB_TOKEN, and such a
  # push does NOT trigger other workflows - so without this, the site would
  # keep serving last week's payload until some other push happened.  The
  # capture workflow itself runs the full test chain before it commits.
  workflow_run:
    workflows: ["Current-season capture + forward ledger (OpenLigaDB)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # On the workflow_run trigger, only deploy a capture that passed its
    # own test chain.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This workflow only ever deploys main; being explicit matters on
          # the workflow_run trigger, where the default ref is the branch
          # that contains the workflow file.
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build site data (offline pipeline on committed fixtures)
        run: python -m northstar.cli run-pipeline --fresh
      - name: Verify fixtures
        run: python -m northstar.cli verify
      - name: Render the site against the fresh payload (node smoke test)
        run: node scripts/site-smoke.mjs
      - name: Assemble site artifact
        run: |
          mkdir -p site-dist/site-data
          cp index.html app.js styles.css site-dist/
          cp site-data/site.json site-dist/site-data/
          cp README.md site-dist/
          mkdir -p site-dist/docs
          cp docs/*.md site-dist/docs/
          # The Sport-coverage view links the raw evidence registry, so the
          # JSON ships with the site (links are relative, no absolute URLs).
          mkdir -p site-dist/data/sources
          cp data/sources/*.json site-dist/data/sources/
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
